name: gameprobe-frontend-dev

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
