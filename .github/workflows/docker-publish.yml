name: Publish frontend image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-dockerhub-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: seocj/gameprobe-frontend

jobs:
  publish:
    # Manual runs on dev or another branch must not publish an image.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Actions secrets."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          cache-from: type=gha,scope=frontend-arm64
          cache-to: type=gha,mode=max,scope=frontend-arm64
          # Do not publish private repository build metadata with the public image.
          provenance: false
          sbom: false

      - name: Show published image
        shell: bash
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### Published frontend image\n\n'
            printf -- '- Tag: `%s`\n' "$IMAGE_TAG"
            printf -- '- Platform: `linux/arm64`\n'
            printf -- '- Deployment reference: `%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  propose-deployment:
    name: Propose deployment image update
    needs: publish
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Check that this is still the latest frontend main commit
        id: current
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          latest_sha="$(gh api "repos/$SOURCE_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$SOURCE_SHA" != "$latest_sha" ]]; then
            echo 'is-current=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment PR skipped: a newer frontend main commit exists.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'is-current=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check deploy repository credentials
        if: steps.current.outputs.is-current == 'true'
        shell: bash
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          if [[ -z "$DEPLOY_REPO_TOKEN" ]]; then
            echo "::error::Set DEPLOY_REPO_TOKEN in frontend Actions secrets (gameprobe/deploy Contents and Pull requests: read and write)."
            exit 1
          fi

      - name: Check out published frontend source
        if: steps.current.outputs.is-current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: frontend
          persist-credentials: false

      - name: Check out deploy main
        if: steps.current.outputs.is-current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gameprobe/deploy
          ref: main
          path: deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          persist-credentials: false

      - name: Update frontend deployment digest
        if: steps.current.outputs.is-current == 'true'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 frontend/.github/scripts/update-deploy-image.py \
            deploy/apps/frontend/kustomization.yaml "$IMAGE_DIGEST" "$SOURCE_SHA"

      - name: Create or update deployment PR
        if: steps.current.outputs.is-current == 'true'
        id: deployment-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy
          base: main
          branch: codex/frontend-image-update
          add-paths: apps/frontend/kustomization.yaml
          commit-message: '[TASK-INFRA-002] 프론트 배포 이미지 갱신'
          title: 'deploy: 프론트 이미지 갱신'
          body: |
            frontend/main에서 게시한 이미지로 프론트 배포 버전을 갱신합니다.
            이 PR을 병합하면 Argo CD 자동 Sync가 활성화된 환경에 배포됩니다.

            - 소스: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - 이미지: `${{ env.IMAGE_NAME }}@${{ needs.publish.outputs.digest }}`
            - 태그: `${{ env.IMAGE_NAME }}:sha-${{ github.sha }}`
            - 플랫폼: `linux/arm64`
            - 이미지 게시: [GitHub Actions 실행](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            변경 범위는 `apps/frontend/kustomization.yaml`의 이미지 digest와 소스 커밋 주석입니다.

      - name: Show deployment proposal
        if: steps.current.outputs.is-current == 'true'
        shell: bash
        env:
          PR_URL: ${{ steps.deployment-pr.outputs.pull-request-url }}
        run: |
          if [[ -n "$PR_URL" ]]; then
            printf '\nDeployment PR: %s\nMerge this PR to deploy after Argo CD auto-sync is enabled.\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nNo deployment PR needed: deploy/main already contains this image.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
